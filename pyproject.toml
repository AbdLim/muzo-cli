[project]
name = "muzo"
version = "0.1.0"
description = "An ambient internet radio experience in your terminal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["radio", "terminal", "tui", "lofi", "ambient", "ascii", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
authors = [
    { name = "Abdulalim Ladan", email = "aaladan453@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.13.5",
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/AbdLim/muzo-cli"
Repository = "https://github.com/AbdLim/muzo-cli"
Issues = "https://github.com/AbdLim/muzo-cli/issues"

[project.scripts]
muzo = "muzo.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

